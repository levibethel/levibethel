<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 803" width="1920" height="803">
  <defs>
    <!-- Deep Night Horror Sky & Forest Background -->
    <radialGradient id="skyGlow" cx="54%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#2A0B05"/>
      <stop offset="32%" stop-color="#120607"/>
      <stop offset="68%" stop-color="#070909"/>
      <stop offset="100%" stop-color="#020303"/>
    </radialGradient>

    <!-- Incandescent Soucouyant Fire-Spirit Orb Core -->
    <radialGradient id="fireOrbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7D6" stop-opacity="1"/>
      <stop offset="18%" stop-color="#FFB732" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#EA4300" stop-opacity="0.82"/>
      <stop offset="70%" stop-color="#7C1100" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1A0300" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Crimson Horror Aura -->
    <radialGradient id="crimsonAura" cx="54%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#FF3B00" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#8B1500" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#050606" stop-opacity="0"/>
    </radialGradient>

    <!-- Marsh Water Reflection Gradient -->
    <linearGradient id="marshWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070908" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#160704" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020303" stop-opacity="1"/>
    </linearGradient>

    <!-- Volumetric Pine Barrens / Kittatinny Fog -->
    <linearGradient id="fogLayer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0F0E" stop-opacity="0"/>
      <stop offset="28%" stop-color="#1E2724" stop-opacity="0.32"/>
      <stop offset="54%" stop-color="#3D190C" stop-opacity="0.28"/>
      <stop offset="82%" stop-color="#18201E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060808" stop-opacity="0"/>
    </linearGradient>

    <!-- Heavy Anamorphic Vignette -->
    <radialGradient id="anamorphicVignette" cx="50%" cy="50%" r="60%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.94"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="emberBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="mistBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- Base Sky -->
  <rect width="1920" height="803" fill="url(#skyGlow)"/>

  <!-- Distant Mountain Ridge Silhouette (Kittatinny Ridge / Ramapo Highlands) -->
  <path d="M0 470 L180 430 L390 455 L610 398 L830 438 L1080 412 L1310 385 L1540 432 L1740 405 L1920 445 L1920 620 L0 620 Z" fill="#070A09" opacity="0.9"/>

  <!-- Background Pine Forest Canopy (Distant Layer) -->
  <g fill="#0A0D0C" opacity="0.85">
    <rect x="70" y="60" width="14" height="520"/>
    <rect x="145" y="40" width="18" height="540"/>
    <rect x="260" y="50" width="15" height="530"/>
    <rect x="340" y="30" width="22" height="550"/>
    <rect x="470" y="45" width="16" height="535"/>
    <rect x="590" y="25" width="19" height="555"/>
    <rect x="710" y="55" width="14" height="525"/>
    <rect x="840" y="35" width="17" height="545"/>
    <rect x="1220" y="40" width="16" height="540"/>
    <rect x="1335" y="20" width="21" height="560"/>
    <rect x="1460" y="50" width="15" height="530"/>
    <rect x="1590" y="30" width="19" height="550"/>
    <rect x="1720" y="45" width="16" height="535"/>
    <rect x="1830" y="25" width="24" height="555"/>
  </g>

  <!-- Volumetric Mist Behind the Entity -->
  <ellipse cx="980" cy="430" rx="760" ry="150" fill="url(#fogLayer1)" filter="url(#mistBlur)"/>
  <ellipse cx="1030" cy="365" rx="480" ry="260" fill="url(#crimsonAura)" filter="url(#softBlur)"/>

  <!-- Old Colonial Stilt Farmhouse Silhouette in Distance (Left-Center) -->
  <g fill="#060707" stroke="#1F120D" stroke-width="1">
    <polygon points="390,415 470,355 550,415"/>
    <rect x="405" y="415" width="130" height="85"/>
    <line x1="420" y1="500" x2="420" y2="555" stroke="#0B0D0C" stroke-width="5"/>
    <line x1="470" y1="500" x2="470" y2="555" stroke="#0B0D0C" stroke-width="5"/>
    <line x1="520" y1="500" x2="520" y2="555" stroke="#0B0D0C" stroke-width="5"/>
    <!-- Faint Tallow Candle Window Glow -->
    <rect x="458" y="438" width="16" height="24" fill="#D95B16" opacity="0.55" filter="url(#emberBlur)"/>
    <rect x="460" y="440" width="12" height="20" fill="#FFB347" opacity="0.75"/>
  </g>

  <!-- THE SOUCOUYANT FIRE-SPIRIT ORB & INCANDESCENT SILHOUETTE (Center-Right Focal Point) -->
  <g>
    <!-- Outer Bioluminescent Fire Halo -->
    <circle cx="1045" cy="340" r="210" fill="url(#fireOrbCore)" filter="url(#softBlur)"/>
    <circle cx="1045" cy="340" r="95" fill="url(#fireOrbCore)"/>

    <!-- Horizontal Anamorphic Flare Streak (2.39:1 Cinema Scope Optical Signature) -->
    <ellipse cx="1045" cy="340" rx="430" ry="3.5" fill="#FF7718" opacity="0.65" filter="url(#emberBlur)"/>
    <ellipse cx="1045" cy="340" rx="220" ry="1.8" fill="#FFF2C2" opacity="0.9"/>

    <!-- Eerie Humanoid / Skinless Silhouette Emerging Inside the Fireball -->
    <path d="M1045 255
             C1028 255, 1020 272, 1025 290
             C1010 302, 992 325, 982 358
             C976 378, 988 382, 998 364
             C1006 346, 1015 332, 1022 330
             C1022 365, 1018 405, 1012 455
             L1032 455
             C1037 415, 1041 388, 1045 388
             C1049 388, 1053 415, 1058 455
             L1078 455
             C1072 405, 1068 365, 1068 330
             C1075 332, 1084 346, 1092 364
             C1102 382, 1114 378, 1108 358
             C1098 325, 1080 302, 1065 290
             C1070 272, 1062 255, 1045 255 Z"
          fill="#1B0401" stroke="#FF9E3D" stroke-width="1.5" opacity="0.92"/>

    <!-- Glowing Cauterized Eyes / Internal Ember Heart -->
    <circle cx="1038" cy="276" r="2.6" fill="#FFF6D6"/>
    <circle cx="1052" cy="276" r="2.6" fill="#FFF6D6"/>
    <ellipse cx="1045" cy="328" rx="14" ry="22" fill="#FFB03A" opacity="0.65" filter="url(#emberBlur)"/>
  </g>

  <!-- Swirling Sulfur Sparks & Cauterized Embers in the Pine Canopy -->
  <g fill="#FF8C24" opacity="0.85">
    <circle cx="880" cy="290" r="2.5" filter="url(#emberBlur)"/>
    <circle cx="925" cy="220" r="1.8"/>
    <circle cx="970" cy="195" r="3.2" filter="url(#emberBlur)"/>
    <circle cx="1120" cy="215" r="2.2"/>
    <circle cx="1175" cy="275" r="3.5" filter="url(#emberBlur)"/>
    <circle cx="1215" cy="330" r="1.6"/>
    <circle cx="1140" cy="410" r="2.4" filter="url(#emberBlur)"/>
    <circle cx="955" cy="395" r="2.8" filter="url(#emberBlur)"/>
    <circle cx="845" cy="365" r="1.9"/>
    <circle cx="1010" cy="160" r="2.1"/>
    <circle cx="1090" cy="175" r="2.7" filter="url(#emberBlur)"/>
  </g>

  <!-- Salt Marsh Water & Dark Reflection Below -->
  <rect x="0" y="545" width="1920" height="258" fill="url(#marshWater)"/>

  <!-- Water Ripples Reflecting the Fire-Spirit -->
  <g opacity="0.55" filter="url(#emberBlur)">
    <ellipse cx="1045" cy="575" rx="115" ry="7" fill="#EA4300"/>
    <ellipse cx="1045" cy="602" rx="95" ry="5" fill="#FF7B1C"/>
    <ellipse cx="1045" cy="628" rx="75" ry="4.5" fill="#C82800"/>
    <ellipse cx="1045" cy="656" rx="58" ry="3.5" fill="#9E1B00"/>
    <ellipse cx="1045" cy="685" rx="38" ry="2.5" fill="#6E0F00"/>
    <ellipse cx="466" cy="572" rx="22" ry="2.5" fill="#D95B16"/>
  </g>

  <!-- Foreground Twisted Pitch Pine Trees & Branches (Framing Left & Right) -->
  <g fill="#030404">
    <!-- Left Foreground Pine Trunk & Gnarled Branches -->
    <path d="M-20 0 L130 0 L105 803 L-20 803 Z"/>
    <path d="M95 140 Q260 175 390 130 Q255 205 98 182 Z"/>
    <path d="M100 280 Q290 320 430 295 Q280 350 100 322 Z"/>
    <!-- Right Foreground Pine Trunk & Gnarled Branches -->
    <path d="M1790 0 L1940 0 L1940 803 L1815 803 Z"/>
    <path d="M1820 185 Q1620 225 1475 190 Q1630 260 1818 228 Z"/>
    <path d="M1825 345 Q1650 385 1530 365 Q1660 412 1822 382 Z"/>
    <!-- Mid-Foreground Dead Cedar Snags -->
    <path d="M210 803 L222 240 L244 240 L258 803 Z"/>
    <path d="M1615 803 L1628 190 L1652 190 L1668 803 Z"/>
  </g>

  <!-- Foreground Ritual Mortar Jar & Coarse Sea Salt Circle on Marsh Bank (Bottom Left-Center) -->
  <g transform="translate(680, 610)">
    <!-- Coarse Sea Salt Ring -->
    <ellipse cx="75" cy="95" rx="95" ry="18" fill="none" stroke="#D8D4C8" stroke-width="3.5" stroke-dasharray="3 6" opacity="0.55"/>
    <ellipse cx="75" cy="95" rx="82" ry="14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="1 5" opacity="0.45"/>
    <!-- Earthenware Mortar Jar Silhouette -->
    <path d="M52 32 L98 32 L106 44 L102 92 C102 98, 48 98, 48 92 L44 44 Z" fill="#0B0908" stroke="#8C3B14" stroke-width="1.5"/>
    <!-- Faint Internal Ember Glow Inside the Jar -->
    <ellipse cx="75" cy="65" rx="16" ry="12" fill="#FF5500" opacity="0.45" filter="url(#emberBlur)"/>
  </g>

  <!-- Low Ground Fog Rolling Over Marsh -->
  <ellipse cx="520" cy="560" rx="620" ry="55" fill="#151C1A" opacity="0.42" filter="url(#mistBlur)"/>
  <ellipse cx="1420" cy="575" rx="580" ry="50" fill="#1C1412" opacity="0.38" filter="url(#mistBlur)"/>

  <!-- 2.39:1 Anamorphic Vignette Over Entire Frame -->
  <rect width="1920" height="803" fill="url(#anamorphicVignette)"/>
</svg>
